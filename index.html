ize:13px}.live-row:last-child{border-bottom:0}.live-vs{font-size:10px;letter-spacing:.7px;color:#8e9cb0;font-weight:900}.live-score{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;color:#2746a3}.empty{padding:26px 16px;text-align:center;color:#8291a5;font-size:13px;line-height:1.7}.empty-icon{font-size:30px;display:block;margin-bottom:8px}.scoreboards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.score-card{overflow:hidden}.match-info{display:flex;justify-content:space-between;align-items:center;background:#f8fafe;border-bottom:1px solid var(--line);padding:13px 16px;font-size:12px}.score-inner{display:grid;grid-template-columns:1fr 34px 1fr;gap:8px;align-items:center;padding:17px}.score-side{min-width:0}.score-name{text-align:center;display:block;font-size:13px;font-weight:900;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;margin-bottom:13px}.score-plus{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #d9e2f6;background:#f0f4ff;border-radius:15px;min-height:136px;width:100%;transition:transform .09s,background .13s;touch-action:manipulation}.score-plus:active{background:#dbe6ff;transform:scale(.975)}.score-plus.green{background:#e8f8f3;border-color:#caebe0}.score-plus.green:active{background:#cdeee4}.score-plus b{font-size:clamp(42px,7vw,65px);line-height:1;letter-spacing:-3px;font-variant-numeric:tabular-nums}.score-plus span{font-size:11px;font-weight:800;opacity:.7;margin-top:13px}.score-sep{color:#aebbd0;font-weight:900;text-align:center;font-size:16px}.minus{display:block;background:#fff;border:1px solid #dfe5ef;border-radius:10px;color:#64748b;width:100%;font-weight:800;font-size:12px;padding:10px 5px;margin-top:9px}.result-tip{text-align:center;border-top:1px solid var(--line);padding:10px;color:#7c8ba1;font-size:11px}.win-hint{color:#178b74;font-weight:800}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.section{margin-bottom:20px}.control{background:#fff;border:1px solid #d9e0ea;border-radius:10px;min-width:0;padding:11px;color:var(--ink)}.control:focus{border-color:#4169e1}.btn{border:0;border-radius:10px;padding:11px 14px;font-size:12px;font-weight:900;background:#eaf0ff;color:#3457bf;transition:filter .15s}.btn:hover{filter:brightness(.96)}.btn.primary{background:#4169e1;color:white}.btn.green{background:#dbf7ea;color:#128267}.btn.danger{background:#fff0ed;color:#c54d42}.btn.ghost{background:#f0f3f8;color:#64748b}.btn.small{padding:7px 9px;font-size:11px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:flex;flex-direction:column;gap:12px}.match-list{display:flex;flex-direction:column;gap:9px}.match-pair{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:12px;background:#f8fafd;border-radius:12px;border:1px solid #edf0f6}.pair-name{font-weight:900;font-size:12px}.pair-note{font-size:11px;color:#8591a2;margin-top:5px}.roster-group{margin-top:16px}.roster-group:first-child{margin-top:0}.roster-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-weight:900}.roster-row{display:grid;grid-template-columns:24px minmax(80px,1fr) 61px 27px 27px 27px;gap:5px;align-items:center;margin-bottom:7px}.roster-row .control{padding:9px 7px;font-size:12px;width:100%}.roster-row select{font-size:11px}.iconbtn{border:1px solid #e4e9f1;border-radius:8px;background:#f8fafd;color:#7a88a1;font-size:13px;height:36px}.roster-number{text-align:center;color:#8794a8;font-weight:800;font-size:11px}.warn{background:#fff8e7;border:1px solid #f4e5b9;color:#816320;padding:12px 14px;font-size:12px;line-height:1.6;border-radius:11px}.danger-text{color:#b84242}.history-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #eef1f5;font-size:12px}.history-row:last-child{border-bottom:0}.history-row strong{font-size:12px}.history-detail{font-size:11px;color:#8896a8;margin-top:5px}.login{max-width:510px;margin:0 auto}.footer{text-align:center;margin-top:40px;font-size:11px;color:#94a3b8}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(110px);max-width:calc(100% - 24px);width:max-content;background:#1c2b45;color:white;font-weight:700;font-size:12px;padding:12px 18px;border-radius:12px;box-shadow:0 14px 40px #19243e38;z-index:90;transition:transform .2s;pointer-events:none}.toast.show{transform:translateX(-50%) translateY(0)}.hidden{display:none!important}.rule-note{border-top:1px solid #eaf0f6;margin-top:12px;padding-top:13px;line-height:1.7}
    @media(max-width:850px){.group-list{grid-template-columns:1fr}.group-top{padding:13px 15px}.ranks{padding:0 13px 6px}.rank-row{min-height:60px}.scoreboards,.admin-grid{grid-template-columns:1fr}.score-plus{min-height:150px}.score-plus b{font-size:65px}}
    @media(max-width:460px){.wrap{width:calc(100% - 24px)}.header{padding-top:18px}.brandicon{width:43px;height:43px}.stats{gap:7px}.stat{padding:11px}.stat b{font-size:19px}.stat small{font-size:10px}.main{padding-top:18px}.card-pad{padding:15px}.roster-row{grid-template-columns:20px minmax(60px,1fr) 55px 25px 25px 25px;gap:3px}.roster-row .control{font-size:11px;padding:9px 4px}.iconbtn{font-size:12px}.match-pair{align-items:flex-start}.match-pair .btn{flex-shrink:0}}

<body>
  <header class="header"><div class="wrap">
    <div class="row between"><span class="eyebrow">SCHOOL TABLE TENNIS · LADDER</span><span class="status" id="connection-status"><span class="dot"></span>준비 중</span></div>
    <div class="h-title"><div class="brandicon">🏓</div><div><h1 id="app-title">우리 학교 탁구 래더</h1><p>A · B · C조 승강식 실시간 순위표</p></div></div>
    <div class="stats"><div class="stat"><b id="stat-players">12</b><small>등록 선수</small></div><div class="stat"><b id="stat-matches">0</b><small>진행 중 경기</small></div><div class="stat"><b id="stat-target">15</b><small>경기 목표 점수</small></div></div>
  </div></header>
  <nav class="nav"><div class="wrap tabs" role="tablist" aria-label="메뉴"><button class="tab selected" data-tab="rank" role="tab" aria-selected="true">🏆 순위표</button><button class="tab" data-tab="score" role="tab" aria-selected="false">🏓 경기 점수판</button><button class="tab" data-tab="admin" role="tab" aria-selected="false">⚙️ 관리자</button></div></nav>
  <main class="main wrap"><div id="view-rank"></div><div id="view-score" class="hidden"></div><div id="view-admin" class="hidden"></div><div class="footer">RANK UP · 한 칸씩 도전하는 탁구 래더</div></main>
  <div class="toast" id="toast" aria-live="polite"></div>
  <script type="module">
    /* ============================================================
      FIREBASE 연결: Firebase 콘솔 > 프로젝트 설정 > 내 앱 > 웹 앱 구성 복사
      아래 6개 값을 내 Firebase 프로젝트 값으로 바꾼 뒤 배포하세요.
      이 설정 자체는 공개되어도 됩니다. 실제 접근 제한은 Firestore 규칙이 담당합니다.
    ============================================================ */
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyDm1ANXTtO7zIh74GAzOL1-lzyP6pHaOHk",
      authDomain: "sejong-pingpong.firebaseapp.com",
      projectId: "sejong-pingpong",
      storageBucket: "sejong-pingpong.firebasestorage.app",
      messagingSenderId: "222447703253",
      appId: "1:222447703253:web:bfe2f6980fa8236283fe5c"
    };
    const SDK_VERSION = '13.4.0';
    const GROUPS = ['A','B','C'];
    const $ = id => document.getElementById(id);
    const copy = value => JSON.parse(JSON.stringify(value));
    const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const makeId = () => (globalThis.crypto?.randomUUID?.() || `p${Date.now()}${Math.random().toString(36).slice(2)}`).replace(/[^a-zA-Z0-9_-]/g, '');
    const nameOf = p => String(p?.name ?? '').trim() || '이름 미입력';
    const groupCount = gs => GROUPS.reduce((n,g)=>n+(gs[g]?.length||0),0);
    function starterBoard(){return {title:'우리 학교 탁구 래더',targetScore:15,groups:Object.fromEntries(GROUPS.map(g=>[g,Array.from({length:4},(_,i)=>({id:`p_${g}_${i+1}`,name:`${g}조 선수 ${i+1}`}))])),activeMatches:[],history:[],updatedAt:Date.now()};}
    const configured = Boolean(FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.includes('여기에') && FIREBASE_CONFIG.projectId && !FIREBASE_CONFIG.projectId.includes('여기에'));
    const DEMO_KEY = 'pingpong-ladder-v1-demo';
    let mode = configured ? 'connecting' : 'demo';
    let board = configured ? null : readDemo();
    let matchMap = new Map();
    let draft = null, dirty=false, tab='rank', user=null, isAdmin=false, firebase=null, boardRef=null;
    let toastTimer=null, busy=false, authError='', initError='';
    function readDemo(){try{const saved=JSON.parse(localStorage.getItem(DEMO_KEY));if(saved?.groups&&saved?.activeMatches)return saved;}catch{}return starterBoard();}
    function saveDemo(){localStorage.setItem(DEMO_KEY,JSON.stringify(board));render();}
    function flat(gs=board?.groups){return gs?GROUPS.flatMap(group=>(gs[group]||[]).map((person,index)=>({group,index,person,rank:0}))).map((r,i)=>({...r,rank:i+1})):[];}
    function allActive(){return board?.activeMatches||[];}
    function matchFor(id){return allActive().find(m=>m.higherId===id||m.lowerId===id);}
    function getMatch(id){return matchMap.get(id)||null;}
    function scoreInfo(m){const s=getMatch(m.id);return s?`${s.scoreHigher} : ${s.scoreLower}`:'0 : 0';}
    function uiToast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3600);}
    function niceError(e){const code=e?.code||'';if(code.includes('permission-denied'))return '접근 권한이 없습니다. 관리자 계정과 Firestore 규칙을 확인해주세요.';if(code.includes('network')||code.includes('unavailable'))return '네트워크 연결을 확인해주세요.';if(code.includes('invalid-credential')||code.includes('wrong-password')||code.includes('invalid-email'))return '이메일 또는 비밀번호를 확인해주세요.';return (e?.message||'요청을 처리하지 못했습니다.').slice(0,180);}
    function activeNames(m){const rows=flat();return [rows.find(r=>r.person.id===m.higherId)?.person?.name||m.higherName||'선수 A', rows.find(r=>r.person.id===m.lowerId)?.person?.name||m.lowerName||'선수 B'];}
    function period(t){if(!t)return '';return new Date(t).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});}
    function renderHeader(){const present=board||starterBoard();$('app-title').textContent=present.title||'우리 학교 탁구 래더';$('stat-players').textContent=flat(present.groups).filter(x=>x.person.name?.trim()).length;$('stat-matches').textContent=allActive().length;$('stat-target').textContent=present.targetScore||15;const status=$('connection-status');status.innerHTML=mode==='live'?'<span class="dot live"></span>실시간 연결':mode==='connecting'?'<span class="dot"></span>연결 중':mode==='error'?'<span class="dot"></span>연결 오류':'<span class="dot"></span>미리보기 모드';}
    function renderRank(){if(!board){$('view-rank').innerHTML=`<div class="card empty"><span class="empty-icon">🏓</span>${mode==='error'?esc(initError):'Firebase 순위표를 불러오는 중입니다.'}</div>`;return;}
      const positions=flat(), playing=allActive();
      const liveBlock=playing.length?`<section class="versus-area"><div class="section-title">🔴 지금 진행 중 <small>${playing.length}경기</small></div><div class="card">${playing.map(m=>{const [h,l]=activeNames(m);return `<div class="live-row"><span><strong>${esc(h)}</strong> <span class="live-vs">VS</span> <strong>${esc(l)}</strong></span><b class="live-score">${esc(scoreInfo(m))}</b></div>`;}).join('')}</div></section>`:'';
      $('view-rank').innerHTML=`<div class="headline"><h2>전체 순위표</h2><span class="chip">A → B → C 래더</span></div><div class="instruction"><span style="font-size:21px">↗️</span><div><strong>한 번에 한 칸! 바로 윗순위에게만 도전</strong><p>이기면 두 선수의 순위가 바뀝니다. B조 1위는 A조 최하위, C조 1위는 B조 최하위에 도전할 수 있습니다. 결과는 관리자 확정 후 반영됩니다.</p></div></div>${liveBlock}<div class="group-list">${GROUPS.map(g=>{const rows=positions.filter(x=>x.group===g);return `<section class="card group-${g}"><div class="group-top"><div class="group-title">${g}조 <span>${g==='A'?'최상위':g==='B'?'도전 그룹':'성장 그룹'}</span></div><span class="chip">${rows.length}명</span></div><div class="ranks">${rows.map(r=>{const game=matchFor(r.person.id), higher=positions[r.rank-2];const challenge=higher?`${higher.group}조 ${higher.index+1}위에 도전 가능`:'전체 1위';return `<div class="rank-row"><span class="rank-no ${r.rank===1?'top':''}">${r.rank===1?'🥇':r.rank}</span><span class="avatar">${esc(nameOf(r.person).slice(0,1))}</span><div class="player"><div class="player-name">${esc(nameOf(r.person))}</div><div class="player-hint ${game?'playing':''}">${game?'● 경기 진행 중':challenge}</div></div></div>`;}).join('')||'<div class="empty">배치된 선수가 없습니다.</div>'}</div>${g!=='A'&&rows.length?`<div class="promote">↗ ${g}조 1위는 윗조 최하위와 승강전 가능</div>`:''}</section>`;}).join('')}</div>`;
    }
    function renderScore(){if(!board){$('view-score').innerHTML='<div class="empty">점수판 연결 중…</div>';return;}const games=allActive();

      <section class="card card-pad section"><div class="section-title">④ 진행 중 경기 · 결과 확정</div>${liveMatches.length?liveMatches.map(m=>{const [h,l]=activeNames(m),s=getMatch(m.id)||{scoreHigher:0,scoreLower:0};return `<div class="match-pair" style="display:block;margin-bottom:10px"><div class="row between"><strong style="font-size:12px">${esc(h)} <span class="live-vs">VS</span> ${esc(l)}</strong><b style="font-size:15px">${s.scoreHigher||0} : ${s.scoreLower||0}</b></div><div class="row" style="margin-top:11px"><button class="btn green small" data-action="finalize" data-mid="${esc(m.id)}" data-winner="${esc(m.higherId)}">${esc(h)} 승리</button><button class="btn green small" data-action="finalize" data-mid="${esc(m.id)}" data-winner="${esc(m.lowerId)}">${esc(l)} 승리</button><button class="btn danger small" data-action="cancel-match" data-mid="${esc(m.id)}">경기 취소</button></div></div>`;}).join(''):'<div class="empty" style="padding:15px">진행 중인 경기가 없습니다.</div>'}<div class="subtle rule-note">아래 순위 선수가 승리하면 두 선수의 자리를 맞바꾸고, 위 순위 선수가 승리하면 순위를 유지합니다. 완료된 경기는 여기서 사라집니다.</div></section>
      <section class="card card-pad section"><div class="section-title">최근 경기 결과 <small>최대 40건</small></div>${(board.history||[]).length?(board.history||[]).slice(0,12).map(h=>`<div class="history-row"><div><strong>${esc(h.winnerName)} 승리</strong><div class="history-detail">${esc(h.higherName)} ${h.scoreHigher} : ${h.scoreLower} ${esc(h.lowerName)} · ${esc(period(h.finishedAt))}</div></div><span class="chip">${h.promoted?'순위 상승':'순위 유지'}</span></div>`).join(''):'<div class="empty" style="padding:16px">아직 경기 기록이 없습니다.</div>'}</section></div></div>`;

    function render(){

    function findDraftPlayer(id){for(const g of GROUPS){const i=draft[g].findIndex(p=>p.id===id);if(i>=0)return {g,i,p:draft[g][i]};}return null;}
    function verifyNoGames(data){if(data.activeMatches?.length)throw new Error('진행 중 경기가 있습니다. 먼저 종료하거나 취소해주세요.');}
    function assertAdjacent(data,higherId,lowerId){const list=flat(data.groups),a=list.findIndex(x=>x.person.id===higherId),b=list.findIndex(x=>x.person.id===lowerId);if(a<0||b!==a+1||!list[a].person.name?.trim()||!list[b].person.name?.trim())throw new Error('지금은 두 선수의 순위가 인접하지 않습니다.');return [list[a],list[b]];}
    async function saveBoardSettings(field,value){if(mode==='demo'){board={...board,[field]:value,updatedAt:Date.now()};saveDemo();return;}await firebase.updateDoc(boardRef,{[field]:value,updatedAt:Date.now()});}
    async function changeRoster(){if(!draft)return;const gs=copy(draft);for(const g of GROUPS){gs[g]=gs[g].map(p=>({id:p.id,name:String(p.name||'').trim()}));}if(groupCount(gs)>120)throw new Error('전체 선수는 최대 120명까지 등록할 수 있습니다.');const ids=flat(gs).map(x=>x.person.id);if(new Set(ids).size!==ids.length)throw new Error('선수 ID가 중복되었습니다.');if(mode==='demo'){verifyNoGames(board);board.groups=gs;dirty=false;saveDemo();}else{await firebase.runTransaction(firebase.db,async tx=>{const snap=await tx.get(boardRef);const data=snap.data();if(!data)throw new Error('순위표를 먼저 생성해주세요.');verifyNoGames(data);tx.update(boardRef,{groups:gs,updatedAt:Date.now()});});dirty=false;draft=copy(gs);}uiToast('선수 배치를 저장했습니다.');}
    function groupLabel(higher,lower){return higher.group===lower.group?`${higher.group}조 순위전`:`${higher.group}·${lower.group}조 승강전`;}
    async function startMatch(higherId,lowerId){const id=makeId(),now=Date.now();if(mode==='demo'){const [h,l]=assertAdjacent(board,higherId,lowerId);if(allActive().some(m=>[m.higherId,m.lowerId].some(x=>x===higherId||x===lowerId)))throw new Error('두 선수 중 이미 경기 중인 선수가 있습니다.');const m={id,higherId,lowerId,groupLabel:groupLabel(h,l),higherName:h.person.name,lowerName:l.person.name,startedAt:now};board.activeMatches.push(m);matchMap.set(id,{...m,scoreHigher:0,scoreLower:0,status:'active'});localStorage.setItem('pingpong-ladder-demo-matches',JSON.stringify([...matchMap.values()]));saveDemo();}else{const ref=firebase.doc(firebase.db,'pingpong_matches',id);await firebase.runTransaction(firebase.db,async tx=>{const snap=await tx.get(boardRef);const data=snap.data();if(!data)throw new Error('순위표가 없습니다.');const [h,l]=assertAdjacent(data,higherId,lowerId);if((data.activeMatches||[]).some(m=>[m.higherId,m.lowerId].some(x=>x===higherId||x===lowerId)))throw new Error('선수가 이미 경기 중입니다.');const m={id,higherId,lowerId,groupLabel:groupLabel(h,l),higherName:h.person.name,lowerName:l.person.name,startedAt:now};tx.set(ref,{...m,scoreHigher:0,scoreLower:0,status:'active'});tx.update(boardRef,{activeMatches:[...(data.activeMatches||[]),m],updatedAt:now});});}uiToast('경기를 시작했습니다. 학생 점수판에 표시됩니다.');}
    async function addPoint(matchId,side,delta){if(!board?.activeMatches.some(m=>m.id===matchId))throw new Error('이미 끝난 경기입니다.');const field=side==='higher'?'scoreHigher':'scoreLower';if(!['higher','lower'].includes(side)||![-1,1].includes(delta))return;if(mode==='demo'){const m=matchMap.get(matchId);if(!m||m.status!=='active')throw new Error('경기가 종료되었습니다.');m[field]=Math.max(0,Math.min(999,m[field]+delta));matchMap.set(matchId,m);localStorage.setItem('pingpong-ladder-demo-matches',JSON.stringify([...matchMap.values()]));render();return;}if(!user)throw new Error('학생 인증이 완료되지 않았습니다. 다시 시도하세요.');const ref=firebase.doc(firebase.db,'pingpong_matches',matchId);await firebase.runTransaction(firebase.db,async tx=>{const snap=await tx.get(ref);if(!snap.exists()||snap.data().status!=='active')throw new Error('경기가 이미 종료되었습니다.');const score=snap.data()[field];const next=score+delta;if(next<0||next>999)return;tx.update(ref,{[field]:next,updatedAt:Date.now()});});}
    async function endMatch(id,winnerId,cancel=false){const now=Date.now();if(mode==='demo'){const m=board.activeMatches.find(m=>m.id===id),score=matchMap.get(id);if(!m||!score)throw new Error('경기를 찾을 수 없습니다.');if(!cancel){const [higher,lower]=assertAdjacent(board,m.higherId,m.lowerId);if(winnerId!==m.higherId&&winnerId!==m.lowerId)throw new Error('승자 정보가 올바르지 않습니다.');const promoted=winnerId===m.lowerId;const winnerName=promoted?lower.person.name:higher.person.name;const history={id,higherName:higher.person.name,lowerName:lower.person.name,winnerName,winnerId,scoreHigher:score.scoreHigher,scoreLower:score.scoreLower,promoted,finishedAt:now};if(promoted){board.groups[higher.group][higher.index]=lower.person;board.groups[lower.group][lower.index]=higher.person;}board.history=[history,...(board.history||[])].slice(0,40);}board.activeMatches=board.activeMatches.filter(m=>m.id!==id);matchMap.delete(id);localStorage.setItem('pingpong-ladder-demo-matches',JSON.stringify([...matchMap.values()]));saveDemo();}else{const ref=firebase.doc(firebase.db,'pingpong_matches',id);await firebase.runTransaction(firebase.db,async tx=>{const b=await tx.get(boardRef);const s=await tx.get(ref);if(!b.exists()||!s.exists())throw new Error('경기를 찾을 수 없습니다.');const data=b.data(),score=s.data(),m=(data.activeMatches||[]).find(m=>m.id===id);if(!m||score.status!=='active')throw new Error('이미 종료된 경기입니다.');const update={activeMatches:data.activeMatches.filter(x=>x.id!==id),updatedAt:now};if(!cancel){const [higher,lower]=assertAdjacent(data,m.higherId,m.lowerId);if(winnerId!==m.higherId&&winnerId!==m.lowerId)throw new Error('승자를 다시 선택해주세요.');const promoted=winnerId===m.lowerId;const gs=copy(data.groups);if(promoted){gs[higher.group][higher.index]=lower.person;gs[lower.group][lower.index]=higher.person;}update.groups=gs;const history={id,higherName:higher.person.name,lowerName:lower.person.name,winnerName:promoted?lower.person.name:higher.person.name,winnerId,scoreHigher:score.scoreHigher,scoreLower:score.scoreLower,promoted,finishedAt:now};update.history=[history,...(data.history||[])].slice(0,40);}
            tx.update(boardRef,update);tx.update(ref,{status:cancel?'canceled':'finished',winnerId:cancel?'':winnerId,finishedAt:now});});}
      uiToast(cancel?'경기를 취소했습니다.':'경기 결과와 순위를 반영했습니다.');}
    async function initialize(){if(mode!=='live'||!isAdmin)throw new Error('관리자만 초기화할 수 있습니다.');await firebase.runTransaction(firebase.db,async tx=>{const snap=await tx.get(boardRef);if(snap.exists())throw new Error('순위표가 이미 존재합니다.');tx.set(boardRef,starterBoard());});uiToast('A·B·C조가 생성되었습니다.');}
    document.querySelectorAll('[data-tab]').forEach(btn=>btn.addEventListener('click',()=>{tab=btn.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'});}));
    document.addEventListener('input',ev=>{const target=ev.target;if(target.matches('[data-name]')){const p=findDraftPlayer(target.dataset.name);if(p){p.p.name=target.value;dirty=true;}}});

    document.addEventListener('submit',async ev=>{if(ev.target.id!=='login-form')return;ev.preventDefault();if(!firebase)return;const fd=new FormData(ev.target);busy=true;authError='';render();try{await firebase.signInWithEmailAndPassword(firebase.auth,String(fd.get('email')).trim(),String(fd.get('password')));}catch(e){authError=niceError(e);uiToast(authError);}finally{busy=false;render();}});
    document.addEventListener('click',async ev=>{
      const point=ev.target.closest('[data-point]');if(point){if(busy)return;try{await addPoint(point.dataset.point,point.dataset.side,Number(point.dataset.delta));}catch(e){uiToast(niceError(e));}return;}
      const btn=ev.target.closest('[data-action]');if(!btn||btn.disabled||busy)return;const act=btn.dataset.action;
      if(!isAdmin&&mode!=='demo')return;
      try{
        if(act==='add-player'){draft[btn.dataset.group].push({id:makeId(),name:''});dirty=true;render();return;}
        if(act==='reset-draft'){draft=copy(board.groups);dirty=false;render();return;}
        if(act==='move-up'||act==='move-down'){const p=findDraftPlayer(btn.dataset.id);if(!p)return;const to=p.i+(act==='move-up'?-1:1);if(to<0||to>=draft[p.g].length)return;[draft[p.g][p.i],draft[p.g][to]]=[draft[p.g][to],draft[p.g][p.i]];dirty=true;render();return;}
        if(act==='remove-player'){const p=findDraftPlayer(btn.dataset.id);if(p&&confirm(`${nameOf(p.p)} 선수를 배치에서 삭제할까요? (저장 전에는 되돌릴 수 있습니다)`)){draft[p.g].splice(p.i,1);dirty=true;render();}return;}
        if(act==='start-match'){if(dirty){uiToast('먼저 수정한 선수 배치를 저장하거나 취소해주세요.');return;}busy=true;await startMatch(btn.dataset.higher,btn.dataset.lower);return;}
        if(act==='save-roster'){busy=true;await changeRoster();return;}
        if(act==='save-score-setting'){const val=Number($('setting-target')?.value);if(!Number.isInteger(val)||val<1||val>100)throw new Error('목표 점수는 1~100점으로 설정하세요.');busy=true;await saveBoardSettings('targetScore',val);uiToast(`목표 점수를 ${val}점으로 변경했습니다.`);return;}
        if(act==='save-title'){const val=String($('setting-title')?.value||'').trim();if(!val||val.length>50)throw new Error('제목은 1~50자로 입력하세요.');busy=true;await saveBoardSettings('title',val);uiToast('제목을 변경했습니다.');return;}
        if(act==='finalize'){const m=allActive().find(x=>x.id===btn.dataset.mid);if(!m)return;const names=activeNames(m),winner=btn.dataset.winner===m.higherId?names[0]:names[1];const isUpset=btn.dataset.winner===m.lowerId;if(!confirm(`${winner} 선수의 승리를 확정할까요?\n${isUpset?'승리하면 두 선수의 순위가 서로 바뀝니다.':'위 선수의 승리이므로 순위가 유지됩니다.'}\n한 번 확정하면 이 화면에서 되돌릴 수 없습니다.`))return;busy=true;await endMatch(m.id,btn.dataset.winner);return;}
        if(act==='cancel-match'){if(!confirm('이 경기를 취소할까요? 점수 기록은 종료되며 순위는 바뀌지 않습니다.'))return;busy=true;await endMatch(btn.dataset.mid,'',true);return;}
        if(act==='initialize'){busy=true;await initialize();return;}
        if(act==='logout'){busy=true;await firebase.signOut(firebase.auth);await firebase.signInAnonymously(firebase.auth);uiToast('관리자에서 로그아웃했습니다.');return;}
      }catch(e){uiToast(niceError(e));}finally{busy=false;render();}
    });
    // 미리보기는 같은 브라우저의 여러 탭에서 순위와 점수판을 함께 확인할 수 있습니다.
    if(mode==='demo'){
      try{const saved=JSON.parse(localStorage.getItem('pingpong-ladder-demo-matches')||'[]');matchMap=new Map(saved.filter(m=>board.activeMatches.some(a=>a.id===m.id)).map(m=>[m.id,m]));}catch{}
      window.addEventListener('storage',ev=>{if(ev.key===DEMO_KEY){board=readDemo();if(!dirty)draft=copy(board.groups);render();}if(ev.key==='pingpong-ladder-demo-matches'){try{matchMap=new Map(JSON.parse(ev.newValue||'[]').map(m=>[m.id,m]));render();}catch{}}});
      render();
    }else{
      render();
      try{
        const base=`https://www.gstatic.com/firebasejs/${SDK_VERSION}/`;
        const [{initializeApp},authLib,dbLib]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
        const app=initializeApp(FIREBASE_CONFIG);const auth=authLib.getAuth(app);const db=dbLib.getFirestore(app);
        firebase={...authLib,...dbLib,auth,db};boardRef=dbLib.doc(db,'pingpong','board');
        dbLib.onSnapshot(boardRef,snap=>{board=snap.exists()?snap.data():null;mode='live';initError='';if(!dirty&&board)draft=copy(board.groups);render();},e=>{mode='error';initError=niceError(e);render();});
        dbLib.onSnapshot(dbLib.query(dbLib.collection(db,'pingpong_matches'),dbLib.where('status','==','active')),snapshot=>{matchMap=new Map(snapshot.docs.map(d=>[d.id,d.data()]));render();},e=>uiToast('경기 점수 연결 오류: '+niceError(e)));
        authLib.onAuthStateChanged(auth,async current=>{user=current;isAdmin=false;authError='';if(current&&!current.isAnonymous){try{const adm=await dbLib.getDoc(dbLib.doc(db,'pingpong_admins',current.uid));if(auth.currentUser?.uid===current.uid)isAdmin=adm.exists();if(!isAdmin)authError='이 계정에 관리자 권한이 없습니다. Firebase에 관리자 UID를 등록하세요.';}catch(e){authError=niceError(e);}}else if(!current){try{await authLib.signInAnonymously(auth);}catch(e){uiToast('학생 점수 기록 인증 오류: '+niceError(e));}}
          render();});
      }catch(e){mode='error';initError='Firebase 설정 또는 네트워크 문제: '+niceError(e);render();}
    }
  </script>
</body>
</html>
