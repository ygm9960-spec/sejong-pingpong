		var count = rsBlock[i * 3 + 0];
		var totalCount = rsBlock[i * 3 + 1];
		var dataCount  = rsBlock[i * 3 + 2];

    PATTERN_POSITION_TABLE : [
        [],
        [6, 18],

        [6, 30],
        [6, 34],
        [6, 22, 38],

        [6, 34, 62, 90, 118],
        [6, 26, 50, 74, 98, 122],
        [6, 30, 54, 78, 102, 126],

        [6, 30, 56, 82, 108, 134],
        [6, 34, 60, 86, 112, 138],
        [6, 30, 58, 86, 114, 142],
        [6, 34, 62, 90, 118, 146],
        [6, 30, 54, 78, 102, 126, 150],
        [6, 24, 50, 76, 102, 128, 154],
        [6, 28, 54, 80, 106, 132, 158],
        [6, 32, 58, 84, 110, 136, 162],
        [6, 26, 54, 82, 110, 138, 166],
        [6, 30, 58, 86, 114, 142, 170]
    ],

    G15 : (1 << 10) | (1 << 8) | (1 << 5) | (1 << 4) | (1 << 2) | (1 << 1) | (1 << 0),
    G18 : (1 << 12) | (1 << 11) | (1 << 10) | (1 << 9) | (1 << 8) | (1 << 5) | (1 << 2) | (1 << 0),
    G15_MASK : (1 << 14) | (1 << 12) | (1 << 10)    | (1 << 4) | (1 << 1),

    getBCHTypeInfo : function(data) {
        var d = data << 10;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) >= 0) {
            d ^= (QRUtil.G15 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G15) ) );    
        }
        return ( (data << 10) | d) ^ QRUtil.G15_MASK;
    },

    getBCHTypeNumber : function(data) {
        var d = data << 12;
        while (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) >= 0) {
            d ^= (QRUtil.G18 << (QRUtil.getBCHDigit(d) - QRUtil.getBCHDigit(QRUtil.G18) ) );    
        }
        return (data << 12) | d;
    },

    getBCHDigit : function(data) {

        var digit = 0;

        while (data !== 0) {
            digit++;
            data >>>= 1;
        }

        return digit;
    },

    getPatternPosition : function(typeNumber) {
        return QRUtil.PATTERN_POSITION_TABLE[typeNumber - 1];
    },

    getMask : function(maskPattern, i, j) {
        
        switch (maskPattern) {
            
        case QRMaskPattern.PATTERN000 : return (i + j) % 2 === 0;
        case QRMaskPattern.PATTERN001 : return i % 2 === 0;
        case QRMaskPattern.PATTERN010 : return j % 3 === 0;
        case QRMaskPattern.PATTERN011 : return (i + j) % 3 === 0;
        case QRMaskPattern.PATTERN100 : return (Math.floor(i / 2) + Math.floor(j / 3) ) % 2 === 0;
        case QRMaskPattern.PATTERN101 : return (i * j) % 2 + (i * j) % 3 === 0;
        case QRMaskPattern.PATTERN110 : return ( (i * j) % 2 + (i * j) % 3) % 2 === 0;
        case QRMaskPattern.PATTERN111 : return ( (i * j) % 3 + (i + j) % 2) % 2 === 0;

        default :
            throw new Error("bad maskPattern:" + maskPattern);
        }
    },

    getErrorCorrectPolynomial : function(errorCorrectLength) {

        var a = new QRPolynomial([1], 0);

        for (var i = 0; i < errorCorrectLength; i++) {
            a = a.multiply(new QRPolynomial([1, QRMath.gexp(i)], 0) );
        }

        return a;
    },

    getLengthInBits : function(mode, type) {

        if (1 <= type && type < 10) {

            // 1 - 9

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 10;
            case QRMode.MODE_ALPHA_NUM  : return 9;
            case QRMode.MODE_8BIT_BYTE  : return 8;
            case QRMode.MODE_KANJI      : return 8;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 27) {

            // 10 - 26

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 12;
            case QRMode.MODE_ALPHA_NUM  : return 11;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 10;
            default :
                throw new Error("mode:" + mode);
            }

        } else if (type < 41) {

            // 27 - 40

            switch(mode) {
            case QRMode.MODE_NUMBER     : return 14;
            case QRMode.MODE_ALPHA_NUM  : return 13;
            case QRMode.MODE_8BIT_BYTE  : return 16;
            case QRMode.MODE_KANJI      : return 12;
            default :
                throw new Error("mode:" + mode);
            }

        } else {
            throw new Error("type:" + type);
        }
    },

    getLostPoint : function(qrCode) {
        
        var moduleCount = qrCode.getModuleCount();
        var lostPoint = 0;
        var row = 0; 
        var col = 0;

        
        // LEVEL1
        
        for (row = 0; row < moduleCount; row++) {

            for (col = 0; col < moduleCount; col++) {

                var sameCount = 0;
                var dark = qrCode.isDark(row, col);

                for (var r = -1; r <= 1; r++) {

                    if (row + r < 0 || moduleCount <= row + r) {
                        continue;
                    }

                    for (var c = -1; c <= 1; c++) {

                        if (col + c < 0 || moduleCount <= col + c) {
                            continue;
                        }

                        if (r === 0 && c === 0) {
                            continue;
                        }

                        if (dark === qrCode.isDark(row + r, col + c) ) {
                            sameCount++;
                        }
                    }
                }

                if (sameCount > 5) {
                    lostPoint += (3 + sameCount - 5);
                }
            }
        }

        // LEVEL2

        for (row = 0; row < moduleCount - 1; row++) {
            for (col = 0; col < moduleCount - 1; col++) {
                var count = 0;
                if (qrCode.isDark(row,     col    ) ) count++;
                if (qrCode.isDark(row + 1, col    ) ) count++;
                if (qrCode.isDark(row,     col + 1) ) count++;
                if (qrCode.isDark(row + 1, col + 1) ) count++;
                if (count === 0 || count === 4) {
                    lostPoint += 3;
                }
            }
        }

        // LEVEL3

        for (row = 0; row < moduleCount; row++) {
            for (col = 0; col < moduleCount - 6; col++) {
                if (qrCode.isDark(row, col) && 
                        !qrCode.isDark(row, col + 1) && 
                         qrCode.isDark(row, col + 2) && 
                         qrCode.isDark(row, col + 3) && 
                         qrCode.isDark(row, col + 4) && 
                        !qrCode.isDark(row, col + 5) && 
                         qrCode.isDark(row, col + 6) ) {
                    lostPoint += 40;
                }
            }
        }

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount - 6; row++) {
                if (qrCode.isDark(row, col) &&
                        !qrCode.isDark(row + 1, col) &&
                         qrCode.isDark(row + 2, col) &&
                         qrCode.isDark(row + 3, col) &&
                         qrCode.isDark(row + 4, col) &&
                        !qrCode.isDark(row + 5, col) &&
                         qrCode.isDark(row + 6, col) ) {
                    lostPoint += 40;
                }
            }
        }

        // LEVEL4
        
        var darkCount = 0;

        for (col = 0; col < moduleCount; col++) {
            for (row = 0; row < moduleCount; row++) {
                if (qrCode.isDark(row, col) ) {
                    darkCount++;
                }
            }
        }
        
        var ratio = Math.abs(100 * darkCount / moduleCount / moduleCount - 50) / 5;
        lostPoint += ratio * 10;

        return lostPoint;       
    }

};

module.exports = QRUtil;

},

	this.moduleCount = 0;

	},
	
	isDark : function(row, col) {
		if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
			throw new Error(row + "," + col);
		}
		return this.modules[row][col];
	},

	getModuleCount : function() {
		return this.moduleCount;
	},
	
	make : function() {
		// Calculate automatically typeNumber if provided is < 1
		if (this.typeNumber < 1 ){
			var typeNumber = 1;
			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}
				if (buffer.getLengthInBits() <= totalDataCount * 8)
					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},
	
	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {

		this.make();

		for (var row = 0; row < this.modules.length; row++) {

			for (var col = 0; col < this.modules[row].length; col++) {

					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);

		for (var r = 8; r < this.moduleCount - 8; r++) {

			if (this.modules[6][c] !== null) {

			}
			this.modules[6][c] = (c % 2 === 0);

		for (var i = 0; i < pos.length; i++) {

					for (var c = -2; c <= 2; c++) {

						} else {

		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}

	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);

	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);

function applyNewBoard(next){if(board&&next){const old=allRows(board.groups),neo=allRows(next.groups);const moved=neo.filter(n=>old.some(o=>o.person.id===n.person.id&&o.rank>n.rank));if(moved.length&&next.updatedAt!==board.updatedAt){const top=moved[0],prev=old.find(o=>o.person.id===top.person.id);announceRank(top.person.name,prev.rank,top.rank,prev.group!==top.group);}}board=next;if(!dirty&&board)draft=clone(board.groups);render();}
function announceRank(name,from,to,promoted){const root=$('fx-root');root.innerHTML=`<div class="rankfx"><span>${promoted?'🏆 그룹 승격!':'🚀 RANK UP!'}</span><strong>${esc(name)} ↑</strong><span>전체 ${from}위 → ${to}위</span></div>`;setTimeout(()=>{root.innerHTML='';},3100);}
function statsAfter(before,winner,loser,afterRanks){const stats=clone(before||{}),w=stats[winner]||{wins:0,losses:0,streak:0,lastFive:[],bestRank:null},l=stats[loser]||{wins:0,losses:0,streak:0,lastFive:[],bestRank:null};w.wins=(w.wins||0)+1;w.streak=(w.streak||0)+1;w.lastFive=['W',...(w.lastFive||[])].slice(0,5);l.losses=(l.losses||0)+1;l.streak=0;l.lastFive=['L',...(l.lastFive||[])].slice(0,5);w.bestRank=Math.min(w.bestRank||Infinity,afterRanks[winner]||Infinity);l.bestRank=Math.min(l.bestRank||Infinity,afterRanks[loser]||Infinity);stats[winner]=w;stats[loser]=l;return stats;}
function ensureAllBest(stats,gs){const s=clone(stats||{});allRows(gs).forEach(r=>{const old=s[r.person.id]||{};s[r.person.id]={wins:old.wins||0,losses:old.losses||0,streak:old.streak||0,lastFive:old.lastFive||[],bestRank:Math.min(old.bestRank||Infinity,r.rank)};});return s;}

async function changeRoster(){if(!draft)throw new Error('선수 명단을 먼저 입력하세요.');const gs=clone(draft);for(const g of GROUPS)gs[g]=gs[g].map(p=>({id:p.id,name:String(p.name||'').trim()}));if(count(gs)>120)throw new Error('선수는 전체 120명 이하로 등록하세요.');const ids=allRows(gs).map(x=>x.person.id);if(new Set(ids).size!==ids.length)throw new Error('선수 ID가 중복되었습니다.');if(mode==='demo'){ensureNoGames(board);board.groups=gs;board.stats=ensureAllBest(board.stats,gs);board.rankVersion=(board.rankVersion||0)+1;board.lastUndo=null;board.updatedAt=now();dirty=false;saveDemo();}else{await firebase.runTransaction(firebase.db,async tx=>{const snap=await tx.get(boardRef);if(!snap.exists())throw new Error('순위표가 없습니다.');const b=snap.data();ensureNoGames(b);tx.update(boardRef,{groups:gs,stats:ensureAllBest(b.stats,gs),rankVersion:(b.rankVersion||0)+1,lastUndo:null,updatedAt:now()});});dirty=false;draft=clone(gs);}toast('선수 배치와 순위를 저장했습니다.');}
async function startMatch(hi,lo){const id=makeId(),pin=pinCode(),time=now(),secretRef=mode==='live'?firebase.doc(firebase.db,'pingpong_match_secrets',id):null,matchRef=mode==='live'?firebase.doc(firebase.db,'pingpong_matches',id):null;
if(mode==='demo'){const [h,l]=adjacent(board,hi,lo);if(active().some(m=>[m.higherId,m.lowerId].some(x=>x===hi||x===lo)))throw new Error('이미 다른 경기를 진행 중인 선수가 있습니다.');const m={id,higherId:hi,lowerId:lo,groupLabel:h.group===l.group?`${h.group}조 순위전`:`${h.group}·${l.group}조 승강전`,higherName:h.person.name,lowerName:l.person.name,startedAt:time};board.activeMatches.push(m);matchMap.set(id,{...m,scoreHigher:0,scoreLower:0,scoreHistory:[],status:'active'});secrets.set(id,pin);saveDemoSecrets();saveDemoMatches();saveDemo();}else{await firebase.runTransaction(firebase.db,async tx=>{const snapshot=await tx.get(boardRef);if(!snapshot.exists())throw new Error('순위표가 없습니다.');const b=snapshot.data(),[h,l]=adjacent(b,hi,lo);if((b.activeMatches||[]).some(m=>[m.higherId,m.lowerId].some(x=>x===hi||x===lo)))throw new Error('이미 경기 중인 선수가 있습니다.');const m={id,higherId:hi,lowerId:lo,groupLabel:h.group===l.group?`${h.group}조 순위전`:`${h.group}·${l.group}조 승강전`,higherName:h.person.name,lowerName:l.person.name,startedAt:time};tx.set(matchRef,{...m,scoreHigher:0,scoreLower:0,scoreHistory:[],status:'active'});tx.set(secretRef,{pin,createdAt:time});tx.update(boardRef,{activeMatches:[...(b.activeMatches||[]),m],updatedAt:time});});secrets.set(id,pin);}toast('경기 시작! PIN/QR을 점수 담당 학생에게 공유하세요.');}

async function joinGame(id,pin){pin=String(pin||'').trim().toUpperCase();if(!pin)throw new Error('경기 PIN을 입력하세요.');if(!active().some(m=>m.id===id))throw new Error('이미 종료된 경기입니다.');if(mode==='demo'){if(secrets.get(id)!==pin)throw new Error('경기 PIN이 올바르지 않습니다.');joined.add(id);toast('점수 입력 권한을 얻었습니다.');render();return;}if(!authUser)throw new Error('학생 인증이 준비되지 않았습니다. 새로고침 후 다시 시도하세요.');const ref=firebase.doc(firebase.db,'pingpong_match_scorekeepers',id,'members',authUser.uid);await firebase.setDoc(ref,{uid:authUser.uid,passcode:pin,joinedAt:now()});joined.add(id);toast('점수 담당자로 연결되었습니다.');render();}
async function editScore(id,action,side){if(!active().some(m=>m.id===id))throw new Error('종료된 경기입니다.');if(!hasScorePermission(id))throw new Error('PIN을 입력한 점수 담당자만 수정할 수 있습니다.');function update(s){if(s.status!=='active')throw new Error('종료된 경기입니다.');const history=Array.isArray(s.scoreHistory)?s.scoreHistory:[];let h=Number(s.scoreHigher||0),l=Number(s.scoreLower||0),newHistory;if(action==='plus'){if(!['higher','lower'].includes(side))throw new Error('점수 입력 오류');if(history.length>=400)throw new Error('경기 득점 최대 기록에 도달했습니다.');if(side==='higher')h++;else l++;newHistory=[...history,side];}else{if(!history.length)throw new Error('취소할 최근 득점이 없습니다.');side=history[history.length-1];if(side==='higher')h--;else l--;newHistory=history.slice(0,-1);}if(h<0||l<0||h>999||l>999)throw new Error('점수 범위를 벗어납니다.');return {scoreHigher:h,scoreLower:l,scoreHistory:newHistory,updatedAt:now()};}
if(mode==='demo'){const s=scoreOf(id);const changed=update(s);matchMap.set(id,{...s,...changed});saveDemoMatches();}else{const ref=firebase.doc(firebase.db,'pingpong_matches',id);await firebase.runTransaction(firebase.db,async tx=>{const s=await tx.get(ref);if(!s.exists())throw new Error('경기가 없습니다.');tx.update(ref,update(s.data()));});}}
async function finishMatch(id,winnerId,cancel=false){const time=now();function outcome(b,s){const m=(b.activeMatches||[]).find(x=>x.id===id);if(!m||s.status!=='active')throw new Error('진행 중인 경기가 아닙니다.');const update={activeMatches:b.activeMatches.filter(x=>x.id!==id),updatedAt:time};if(!cancel){const [h,l]=adjacent(b,m.higherId,m.lowerId);if(winnerId!==m.higherId&&winnerId!==m.lowerId)throw new Error('승리한 선수를 선택하세요.');const promoted=winnerId===m.lowerId,gs=clone(b.groups);if(promoted){gs[h.group][h.index]=l.person;gs[l.group][l.index]=h.person;}const ranks=Object.fromEntries(allRows(gs).map(r=>[r.person.id,r.rank]));const stats=statsAfter(ensureAllBest(b.stats,b.groups),winnerId,winnerId===m.higherId?m.lowerId:m.higherId,ranks);const entry={id,seasonNo:b.seasonNo||1,higherId:m.higherId,lowerId:m.lowerId,higherName:h.person.name,lowerName:l.person.name,winnerId,winnerName:promoted?l.person.name:h.person.name,scoreHigher:Number(s.scoreHigher)||0,scoreLower:Number(s.scoreLower)||0,promoted,finishedAt:time};const version=(b.rankVersion||0)+1;Object.assign(update,{groups:gs,stats,history:[entry,...(b.history||[])].slice(0,200),finishedCount:(b.finishedCount??b.history?.length??0)+1,rankVersion:version,lastUndo:{matchId:id,version,previousGroups:clone(b.groups),previousStats:clone(b.stats||{}),previousCount:b.finishedCount??b.history?.length??0}});}return update;}
if(mode==='demo'){const s=scoreOf(id),update=outcome(board,s);Object.assign(board,update);matchMap.set(id,{...s,status:cancel?'canceled':'finished',winnerId:cancel?'':winnerId,finishedAt:time});saveDemoMatches();saveDemo();}else{const ref=firebase.doc(firebase.db,'pingpong_matches',id);await firebase.runTransaction(firebase.db,async tx=>{const [bs,ms]=await Promise.all([tx.get(boardRef),tx.get(ref)]);if(!bs.exists()||!ms.exists())throw new Error('경기를 찾을 수 없습니다.');const update=outcome(bs.data(),ms.data());tx.update(boardRef,update);tx.update(ref,{status:cancel?'canceled':'finished',winnerId:cancel?'':winnerId,finishedAt:time});});}secrets.delete(id);joined.delete(id);toast(cancel?'경기를 취소했습니다.': '교사 승패 확정 완료 · 순위를 반영했습니다.');}
async function undoLastResult(){function result(b){if((b.activeMatches||[]).length)throw new Error('경기가 진행 중일 때는 결과 복구가 불가능합니다.');const u=b.lastUndo;if(!u||b.history?.[0]?.id!==u.matchId||b.rankVersion!==u.version)throw new Error('복구할 직전 경기 결과가 없습니다. (이후 순위가 바뀌었을 수 있습니다.)');return {groups:u.previousGroups,stats:u.previousStats,history:b.history.slice(1),finishedCount:u.previousCount,rankVersion:(b.rankVersion||0)+1,lastUndo:null,updatedAt:now()};}
if(mode==='demo'){const u=board.lastUndo,update=result(board);Object.assign(board,update);const m=scoreOf(u.matchId);matchMap.set(u.matchId,{...m,status:'reverted'});saveDemoMatches();saveDemo();}else{await firebase.runTransaction(firebase.db,async tx=>{const bs=await tx.get(boardRef);if(!bs.exists())throw new Error('순위표가 없습니다.');const b=bs.data(),update=result(b),ref=firebase.doc(firebase.db,'pingpong_matches',b.lastUndo.matchId);const ms=await tx.get(ref);if(!ms.exists()||ms.data().status!=='finished')throw new Error('경기 기록을 복구할 수 없습니다.');tx.update(boardRef,update);tx.update(ref,{status:'reverted',updatedAt:now()});});}toast('직전 결과와 순위를 복구했습니다. 경기 자체는 재시작하지 않습니다.');}
async function newSeason(){function make(b){ensureNoGames(b);const snapshot={seasonNo:b.seasonNo||1,archivedAt:now(),title:b.title,groups:b.groups,stats:b.stats||{},history:b.history||[],finishedCount:b.finishedCount??b.history?.length??0,targetScore:b.targetScore,winByTwo:!!b.winByTwo,pointCap:b.pointCap||0};const next={...b,seasonNo:(b.seasonNo||1)+1,stats:ensureAllBest({},b.groups),history:[],finishedCount:0,lastUndo:null,rankVersion:(b.rankVersion||0)+1,updatedAt:now()};return {snapshot,next};}
if(mode==='demo'){const {snapshot,next}=make(board);const archives=JSON.parse(localStorage.getItem('pingpong-ladder-demo-seasons')||'[]');archives.push(snapshot);localStorage.setItem('pingpong-ladder-demo-seasons',JSON.stringify(archives));seasons=archives;board=next;saveDemo();}else{const archiveRef=firebase.doc(firebase.db,'pingpong_seasons','season_'+(board.seasonNo||1));await firebase.runTransaction(firebase.db,async tx=>{const bs=await tx.get(boardRef);if(!bs.exists())throw new Error('순위표가 없습니다.');const existing=await tx.get(archiveRef);if(existing.exists())throw new Error('이 시즌은 이미 보관되어 있습니다.');const {snapshot,next}=make(bs.data());tx.set(archiveRef,snapshot);tx.set(boardRef,next);});}toast('기존 시즌 보관 완료 · 새 시즌이 시작됐습니다. 선수 배치는 유지됩니다.');}
async function initialize(){if(mode!=='live'||!isAdmin)throw new Error('관리자만 만들 수 있습니다.');await firebase.runTransaction(firebase.db,async tx=>{const s=await tx.get(boardRef);if(s.exists())throw new Error('이미 순위표가 있습니다.');tx.set(boardRef,startBoard());});toast('A/B/C조 각 4명 순위표를 생성했습니다.');}
function showQr(mid){const code=secrets.get(mid);if(!code)return toast('경기 PIN을 불러오는 중입니다.');modal={type:'qr',mid};$('modal-root').innerHTML=`<div class="overlay" data-close="modal"><div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><div class="between"><b>경기 QR · 점수 담당자용</b><button class="btn gray sm" data-close="modal">닫기 ✕</button></div></div><div class="modalbody"><div class="qrbox" id="big-qrcode" style="width:240px;height:240px"></div><p class="qrnotice">스캔한 학생이 점수판을 입력할 수 있습니다. 무단 공유에 주의하세요.</p><p style="text-align:center" class="token">${esc(code)}</p><button class="btn primary" data-act="copy-join" data-mid="${esc(mid)}" style="width:100%">접속 링크 복사</button></div></div></div>`;const box=$('big-qrcode');if(typeof window.QRCode==='function'){new window.QRCode(box,{text:qrUrl(mid,code),width:218,height:218});}else box.innerHTML='<p class="caption">QR 라이브러리 로딩 실패 · 링크 복사 이용</p>';}
function showProfile(id){profileId=id;tab='records';render();window.scrollTo({top:0,behavior:'smooth'});}
async function maybeAutoJoin(){if(!pendingPin||!pendingMatch||!authUser)return;if(!active().some(m=>m.id===pendingMatch))return;const id=pendingMatch,pin=pendingPin;pendingPin='';pendingMatch='';try{await joinGame(id,pin);tab='score';render();setTimeout(()=>$('score-'+id)?.scrollIntoView({behavior:'smooth',block:'start'}),200);}catch(e){tab='score';render();toast('QR 연결 실패: '+readable(e));}finally{history.replaceState(null,'',location.pathname+location.search);}}
document.querySelectorAll('[data-tab]').forEach(el=>el.addEventListener('click',()=>{tab=el.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'});}));
document.addEventListener('input',e=>{if(e.target.matches('[data-name]')&&draft){const p=findDraft(e.target.dataset.name);if(p){p.p.name=e.target.value;dirty=true;}}});document.addEventListener('change',e=>{if(e.target.matches('[data-move]')&&draft){const p=findDraft(e.target.dataset.move),to=e.target.value;if(p&&GROUPS.includes(to)&&p.g!==to){draft[p.g].splice(p.i,1);draft[to].push(p.p);dirty=true;render();}}});
document.addEventListener('submit',async e=>{if(e.target.id==='login-form'){e.preventDefault();if(!firebase||busy)return;const f=new FormData(e.target);busy=true;authError='';try{await firebase.signInWithEmailAndPassword(firebase.auth,String(f.get('email')).trim(),String(f.get('password')));}catch(err){authError=readable(err);toast(authError);}finally{busy=false;render();}}if(e.target.matches('[data-join]')){e.preventDefault();const m=e.target.dataset.join,f=new FormData(e.target);try{await joinGame(m,String(f.get('pin')));}catch(err){toast(readable(err));}}});
document.addEventListener('click',async e=>{const close=e.target.closest('[data-close]');if(close){if(e.target.classList.contains('overlay')||e.target.closest('button'))$('modal-root').innerHTML='';return;}const p=e.target.closest('[data-profile]');if(p){showProfile(p.dataset.profile);return;}const ps=e.target.closest('[data-profile-select]');if(ps){profileId=ps.dataset.profileSelect;render();return;}const score=e.target.closest('[data-score]');if(score){if(busy)return;try{await editScore(score.dataset.mid,score.dataset.score,score.dataset.side);if(mode==='demo')score.classList.add('pulse');}catch(err){toast(readable(err));}return;}const btn=e.target.closest('[data-act]');if(!btn||btn.disabled||busy)return;const act=btn.dataset.act;if(!isAdmin&&mode!=='demo')return;let busyAction=true;try{if(act==='add-player'){draft[btn.dataset.group].push({id:makeId(),name:''});dirty=true;render();return;}if(act==='cancel-edit'){draft=clone(board.groups);dirty=false;render();return;}if(['up','down','remove'].includes(act)){const p=findDraft(btn.dataset.pid);if(!p)return;if(act==='remove'){if(!confirm(`${nameOf(p.p)} 선수를 삭제할까요?`))return;draft[p.g].splice(p.i,1);}else{const pos=p.i+(act==='up'?-1:1);if(pos<0||pos>=draft[p.g].length)return;[draft[p.g][p.i],draft[p.g][pos]]=[draft[p.g][pos],draft[p.g][p.i]];}dirty=true;render();return;}if(act==='copy-join'){const pin=secrets.get(btn.dataset.mid);if(!pin)throw new Error('PIN을 불러오는 중입니다.');const link=qrUrl(btn.dataset.mid,pin);try{await navigator.clipboard.writeText(link);toast('경기 점수판 QR 링크를 복사했습니다.');}catch{prompt('복사할 점수판 링크:',link);}return;}if(act==='view-qr'){showQr(btn.dataset.mid);return;}if(act==='export-csv'){exportCsv();return;}if(act==='export-json'){download(`탁구_시즌${board.seasonNo||1}_백업.json`,JSON.stringify({exportedAt:new Date().toISOString(),board},null,2),'application/json');return;}busy=true;if(act==='save-roster'){await changeRoster();}else if(act==='save-settings'){const target=Number($('setting-target').value),cap=Number($('setting-cap').value),two=$('setting-deuce').checked;if(!Number.isInteger(target)||target<1||target>100)throw new Error('목표 점수는 1~100점입니다.');if(!Number.isInteger(cap)||cap<0||cap>999||cap>0&&cap<target)throw new Error('최대 점수는 0 또는 목표 점수 이상~999점입니다.');await updateSettings({targetScore:target,pointCap:cap,winByTwo:two});toast('경기 점수 설정을 저장했습니다.');}else if(act==='save-title'){const title=String($('setting-title').value).trim();if(!title||title.length>50)throw new Error('대회명은 1~50자여야 합니다.');await updateSettings({title});toast('대회명을 저장했습니다.');}else if(act==='start-match'){if(dirty)throw new Error('선수 편집 내용을 먼저 저장하거나 취소하세요.');await startMatch(btn.dataset.hi,btn.dataset.lo);}else if(act==='finish'){const m=active().find(x=>x.id===btn.dataset.mid);if(!m)return;const winner=m.higherId===btn.dataset.winner?m.higherName:m.lowerName,promote=btn.dataset.winner===m.lowerId;if(!confirm(`${winner} 학생의 승리를 선생님이 확정하시겠습니까?\n${promote?'아래 순위가 승리했으므로 두 선수의 순위가 바뀝니다.':'상위 순위가 승리했으므로 순위는 유지됩니다.'}\n※ 점수와 상관없이 이 결정을 최종 반영합니다.`))return;await finishMatch(m.id,btn.dataset.winner);}else if(act==='cancel-match'){if(!confirm('경기를 취소하시겠습니까? 순위에는 영향이 없습니다.'))return;await finishMatch(btn.dataset.mid,'',true);}else if(act==='undo-result'){if(!confirm('가장 최근 확정한 1경기의 결과를 되돌리고 순위를 복구하시겠습니까?'))return;await undoLastResult();}else if(act==='new-season'){if(!confirm('현재 시즌 전적과 순위를 보관하고 새로운 시즌을 시작할까요?\n선수 이름과 현재 조 배치는 유지되고 전적이 초기화됩니다.'))return;if(!confirm('새 시즌을 시작합니다. 정말 진행하시겠습니까?'))return;await newSeason();}else if(act==='initialize'){await initialize();}else if(act==='logout'){await firebase.signOut(firebase.auth);await firebase.signInAnonymously(firebase.auth);toast('관리자 계정에서 로그아웃했습니다.');}}catch(err){toast(readable(err));}finally{busy=false;render();}});
function setDemoData(){try{const saved=JSON.parse(localStorage.getItem(DEMO_MATCHES)||'[]');matchMap=new Map(saved.map(m=>[m.id,m]));}catch{}try{secrets=new Map(Object.entries(JSON.parse(localStorage.getItem(DEMO_SECRETS)||'{}')));}catch{}try{seasons=JSON.parse(localStorage.getItem('pingpong-ladder-demo-seasons')||'[]');}catch{}isAdmin=true;}
function listenSeasons(){
  if(seasonUnsubscribe){seasonUnsubscribe();seasonUnsubscribe=null;}
  seasons=[];
  if(mode==='demo'||mode==='error'||!firebase||!isAdmin)return;
  seasonUnsubscribe=firebase.onSnapshot(firebase.collection(firebase.db,'pingpong_seasons'),snapshot=>{
    seasons=snapshot.docs.map(doc=>({id:doc.id,seasonNo:doc.data().seasonNo})).sort((a,b)=>a.seasonNo-b.seasonNo);
    if(tab==='admin')render();
  },error=>console.warn('이전 시즌 조회 실패',error));
}
function initQrFragment(){const params=new URLSearchParams(location.hash.replace(/^#/,''));pendingMatch=params.get('match')||'';pendingPin=params.get('pin')||'';if(pendingMatch)tab='score';}
initQrFragment();if(mode==='demo'){setDemoData();render();window.addEventListener('storage',ev=>{if(ev.key===DEMO_KEY){const old=board;const newer=readDemo();applyNewBoard(newer);}if(ev.key===DEMO_MATCHES){setDemoData();render();}if(ev.key===DEMO_SECRETS){setDemoData();render();}});if(pendingMatch&&pendingPin){joinGame(pendingMatch,pendingPin).then(()=>{history.replaceState(null,'',location.pathname+location.search);render();}).catch(()=>{});}}
else{render();try{const base=`https://www.gstatic.com/firebasejs/${SDK_VERSION}/`;const [appLib,authLib,dbLib]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);const app=appLib.initializeApp(FIREBASE_CONFIG),auth=authLib.getAuth(app),db=dbLib.getFirestore(app);firebase={...authLib,...dbLib,auth,db};boardRef=dbLib.doc(db,'pingpong','board');dbLib.onSnapshot(boardRef,snapshot=>{mode='live';initError='';applyNewBoard(snapshot.exists()?snapshot.data():null);refreshSecrets();refreshMembership();maybeAutoJoin();},error=>{mode='error';initError=readable(error);render();});dbLib.onSnapshot(dbLib.query(dbLib.collection(db,'pingpong_matches'),dbLib.where('status','==','active')),snap=>{matchMap=new Map(snap.docs.map(d=>[d.id,d.data()]));render();},error=>toast('실시간 점수 연결 오류: '+readable(error)));
authLib.onAuthStateChanged(auth,async user=>{authUser=user;isAdmin=false;joined.clear();secrets.clear();authError='';if(user&&!user.isAnonymous){try{const adm=await dbLib.getDoc(dbLib.doc(db,'pingpong_admins',user.uid));if(auth.currentUser?.uid===user.uid)isAdmin=adm.exists();if(!isAdmin)authError='이 로그인 계정에 관리자 권한이 없습니다. Firebase에서 관리자 UID를 등록하세요.';}catch(err){authError=readable(err);}}if(!user){try{await authLib.signInAnonymously(auth);}catch(err){toast('학생 인증 오류: '+readable(err));}}listenSeasons();render();refreshSecrets();refreshMembership();maybeAutoJoin();});
}catch(err){mode='error';initError='Firebase 설정이나 연결 문제: '+readable(err);render();}}
